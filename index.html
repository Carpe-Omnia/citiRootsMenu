<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1510">
<title>What's on the shelf near you</title>
<meta name="description" content="Swipe through products at licensed New Jersey dispensaries near you.">
<link rel="stylesheet" href="assets/feed.css">
</head>
<body>

<!-- Step 1: age check + location -->
<section id="gate" class="gate" hidden>
  <div class="gate-inner">
    <p class="gate-kicker">New Jersey dispensaries</p>
    <h1>What's on the shelf<br>near you</h1>
    <p class="gate-copy">Swipe through real products at licensed dispensaries close by, with how far away each one is.</p>
    <button id="useLocation" class="btn btn-primary" type="button">I'm 21+ &middot; Use my location</button>
    <button id="showZip" class="btn btn-ghost" type="button">I'm 21+ &middot; Enter a ZIP code instead</button>
    <form id="zipForm" class="zip-form" hidden>
      <input id="zipInput" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="NJ ZIP code" autocomplete="postal-code" aria-label="ZIP code">
      <button class="btn btn-primary" type="submit">Go</button>
    </form>
    <p id="gateMsg" class="gate-msg" role="status"></p>
    <p class="gate-fine">You must be 21 or older to view this site. Your location is only used on your phone to work out distances.</p>
  </div>
</section>

<!-- Step 2: the feed -->
<header id="topbar" class="topbar" hidden>
  <span class="topbar-title">Near you</span>
  <button id="changeLocation" class="topbar-loc" type="button"><span id="locLabel">Locating...</span> <span aria-hidden="true">&#9998;</span></button>
</header>
<main id="feed" class="feed" hidden aria-live="polite"></main>

<script src="assets/feed.js"></script>
</body>
</html>
